<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艺术 IP 系列课 · 网课知识库</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0d0c12;
    --paper:#17151f;
    --paper-2:#1f1c2a;
    --ink:#ece9f3;
    --ink-2:#bfb7cc;
    --ink-3:#827a95;
    --line:#2a2536;
    --line-2:#332d40;
    --accent:#8b5cf6;
    --accent-soft:#2a1f3d;
    --green:#84cc16;
    --green-soft:#212d14;
    --cyan:#38bdf8;
    --cyan-soft:#122633;
    --gold:#f5b85c;
    --gold-soft:#2d2413;
    --sidebar:#0a0910;
    --sidebar-ink:#e8e4f2;
    --sidebar-ink-2:#8a819e;
    --shadow:0 8px 28px rgba(0,0,0,.45);
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.75;letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;font-size:14px;overflow-wrap:break-word;
  }
  html::-webkit-scrollbar{display:none;}
  html{ -ms-overflow-style:none; scrollbar-width:none; }

  img,video{max-width:100%;height:auto}
  a{color:inherit;text-decoration:none}
  mark{background:#2a1f3d;color:#c4b5fd;border-radius:3px;padding:0 2px}

  .top-progress-wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    z-index: 60;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .top-progress-wrap.show {
    opacity: 1;
  }
  .top-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#7b2cbf,#2ec4b6);
  }

  .current-part-hint{
    position:fixed;
    top:4px;
    left:310px;
    z-index:61;
    font-size:12px;
    color:var(--ink-2);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .current-part-hint.show{opacity:1;}

  .custom-scroll-track {
    position: fixed;
    top:0;
    right:4px;
    width:8px;
    height:100vh;
    z-index:55;
    pointer-events:none;
  }
  .custom-scroll-thumb{
    pointer-events:auto;
    width:6px;
    height:36px;
    border-radius:999px;
    background:rgba(255,255,255,0.35);
    opacity:0;
    transition:opacity 0.25s ease;
    cursor:grab;
  }
  .custom-scroll-thumb.show,
  .custom-scroll-thumb.active{opacity:1;}
  .custom-scroll-thumb:active{cursor:grabbing;}

  .topbar{
    position:sticky;top:0;z-index:40;display:none;
    background:var(--sidebar);color:var(--sidebar-ink);
    padding:12px 16px;align-items:center;gap:12px;
    border-bottom:1px solid var(--line);
  }
  .topbar .burger{
    width:38px;height:38px;border:1px solid var(--line-2);border-radius:10px;
    background:transparent;color:var(--sidebar-ink);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.25s;
  }
  .topbar .burger:hover{border-color:var(--accent);color:var(--accent)}
  .topbar .tt{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;flex:1}
  .m-switch{display:flex;background:#1c1926;border-radius:10px;padding:3px;gap:3px}
  .m-switch button{border:0;background:transparent;color:var(--sidebar-ink-2);font-family:inherit;font-size:12.5px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:.25s;white-space:nowrap}
  .m-switch button.active{background:#2a2438;color:#fff;font-weight:600}

  .layout{display:grid;grid-template-columns:296px 1fr;max-width:1280px;margin:0 auto}
  aside.sidebar{
    position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--sidebar);color:var(--sidebar-ink);
    padding:28px 20px 40px;scrollbar-width:thin;
  }
  .brand{margin-bottom:22px}
  .brand .kicker{font-size:11px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
  .brand h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:18px;line-height:1.4;margin-top:6px}
  .brand p{font-size:12px;color:var(--sidebar-ink-2);margin-top:6px;line-height:1.6}
  .search{position:relative;margin-bottom:22px}
  .search input{
    width:100%;background:#1c1926;border:1px solid var(--line-2);border-radius:11px;
    color:var(--sidebar-ink);padding:10px 12px 10px 36px;font-size:13px;font-family:inherit;outline:none;transition:.25s;
  }
  .search input::placeholder{color:var(--sidebar-ink-2)}
  .search input:focus{border-color:var(--accent);background:#221d30;box-shadow:0 0 0 3px rgba(139,92,246,.18)}
  .search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sidebar-ink-2);font-size:14px}
  .search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--sidebar-ink-2);cursor:pointer;font-size:14px;display:none}
  .toc-group{margin-bottom:18px}
  .toc-group > .toc-title{
    display:flex;align-items:center;gap:8px;padding:0 10px;margin-bottom:8px;
  }
  .toc-badge{font-size:10.5px;letter-spacing:.08em;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;font-weight:600;flex:none}
  .toc-cname{font-size:12px;color:var(--sidebar-ink-2);font-weight:500;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toc-list{display:flex;flex-direction:column;gap:2px;padding-left:4px}
  .toc-list a{
    display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--sidebar-ink);
    padding:7px 10px;border-radius:9px;border-left:2px solid transparent;line-height:1.5;
    transition:background .25s ease,color .25s ease,border-color .25s ease;
  }
  .toc-list a:hover{background:#1c1926}
  .toc-list a.active{background:var(--accent-soft);border-left-color:var(--accent);color:#fff;font-weight:600}
  .toc-list a.active .no{color:var(--accent)}
  .toc-list a .no{color:var(--sidebar-ink-2);font-size:11.5px;min-width:22px;transition:color .25s}

  .toc-badge-locked{background:var(--green-soft);color:var(--green)}
  .toc-list a.locked{color:var(--sidebar-ink-2);cursor:not-allowed;gap:7px;border-left-color:transparent}
  .toc-list a.locked:hover{background:#17151f}
  .toc-list a.locked .lock-ic{opacity:.65;flex:none;display:flex;align-items:center}
  .toc-list a.locked .lock-ic svg{width:12px;height:12px}
  .toc-list a.locked .lk-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toc-list a.locked .lock-tag{
    font-size:9.5px;color:var(--ink-3);background:#24212e;border-radius:5px;padding:1px 6px;flex:none;letter-spacing:.04em;
  }
  .toc-list a.locked .lock-tag.flash{color:var(--green);border:1px solid var(--green);background:var(--green-soft)}
  .toc-group.toc-locked-group{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
  @keyframes denied{
    0%{transform:translateX(0)}
    18%{transform:translateX(8px)}
    38%{transform:translateX(-7px)}
    58%{transform:translateX(5px)}
    78%{transform:translateX(-3px)}
    100%{transform:translateX(0)}
  }
  .denied{animation:denied .45s ease}
  .toc-promo{
    flex:none;font-size:9.5px;letter-spacing:.05em;color:var(--green);background:var(--green-soft);
    border:1px solid rgba(132,204,22,.28);border-radius:5px;padding:1px 7px;font-weight:600;
  }
  .head-promo{
    font-size:11px;letter-spacing:.05em;color:var(--green);background:var(--green-soft);
    border:1px solid rgba(132,204,22,.28);border-radius:7px;padding:3px 10px;font-weight:600;align-self:center;
  }
  .locked-block{
    background:linear-gradient(160deg,#0a0a10 0%,#0d1018 50%,#111624 100%);
    border:1px solid var(--line);color:#ece9f3;
    border-radius:20px;padding:40px 30px;margin-top:30px;position:relative;overflow:hidden;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  .locked-block::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:radial-gradient(120% 90% at 85% 0%,rgba(80,110,190,.10),transparent 55%),
               radial-gradient(120% 90% at 10% 100%,rgba(80,110,190,.06),transparent 55%);
  }
  .lock-head{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;position:relative;z-index:1}
  .lock-badge{
    flex:none;width:52px;height:52px;border-radius:50%;
    background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.22);
    color:#c4b5fd;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 6px rgba(139,92,246,.05), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .lock-badge svg{width:22px;height:22px}
  .lock-head-text{display:flex;flex-direction:column;gap:6px;align-items:center}
  .lock-kicker{font-size:10px;letter-spacing:.32em;color:var(--ink-3);text-transform:uppercase}
  .lock-head-text h3{font-family:"Noto Serif SC",serif;font-size:clamp(18px,2.2vw,20px);font-weight:700;line-height:1.45;color:var(--ink);letter-spacing:.04em}
  .brand-sub{font-size:12px;color:var(--sidebar-ink-2);font-weight:400;letter-spacing:.06em}
  .side-switch{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:flex;background:#1c1926;border-radius:11px;padding:4px;gap:4px}
  .side-switch button{flex:1;border:0;background:transparent;color:var(--sidebar-ink-2);font-family:inherit;font-size:13px;cursor:pointer;padding:8px 0;border-radius:8px;transition:.25s}
  .side-switch button.active{background:#2a2438;color:#fff;font-weight:600}
  .overlay{display:none}

  main{padding:0 40px 90px;min-width:0;max-width:860px}
  .hero{padding:52px 0 30px;border-bottom:1px solid var(--line);
    background:
      radial-gradient(700px 240px at 85% 0%, rgba(139,92,246,.15), transparent 60%),
      radial-gradient(600px 220px at 10% 20%, rgba(132,204,22,.12), transparent 55%);
  }
  .hero .tag{display:inline-block;font-size:12px;letter-spacing:.25em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 14px;margin-bottom:18px}
  .hero h2{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(22px,3vw,28px);line-height:1.35}
  .hero h2 em{font-style:normal;color:var(--accent)}
  .hero p{margin-top:12px;color:var(--ink-2);font-size:13.5px;max-width:680px;line-height:1.7}
  .hero .stats{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
  .hero .stats div{font-size:12px;color:var(--ink-3)}
  .hero .stats b{display:block;font-family:"Noto Serif SC",serif;font-size:19px;color:var(--ink)}

  .course-head{margin:38px 0 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .course-head .badge{font-family:"Noto Serif SC",serif;font-weight:900;font-size:13.5px;color:#fff;background:var(--green);border-radius:11px;padding:8px 14px}
  .course.alt .course-head .badge{background:var(--accent)}
  .course-head h3{font-family:"Noto Serif SC",serif;font-size:clamp(19px,2.2vw,22px);font-weight:700;color:var(--ink)}
  .course-head p{color:var(--ink-3);font-size:12.5px;width:100%;margin-top:4px}

  section.module{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 30px 26px;margin-bottom:22px;box-shadow:var(--shadow);scroll-margin-top:76px;
    transition:border-color .25s ease,transform .25s ease,box-shadow .25s ease,opacity .25s ease;
  }
  section.module:hover{border-color:var(--line-2)}
  .fade-up{animation:fadeUp .35s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  section.module.reveal{opacity:0;transform:translateY(16px)}
  section.module.reveal.in{animation:revealIn .55s cubic-bezier(.22,.61,.36,1) both}
  @keyframes revealIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .module-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .num{
    flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;color:#fff;background:var(--accent);
  }
  .course.alt .num{background:var(--green)}
  .module-head .tt{flex:1;min-width:0}
  .module-head h4{font-family:"Noto Serif SC",serif;font-size:clamp(16.5px,2vw,18px);font-weight:700;line-height:1.45;color:var(--ink)}
  .kn{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
  .kn span{font-size:12px;color:var(--ink-3);background:var(--paper-2);border:1px solid var(--line-2);border-radius:7px;padding:3px 10px}
  .kn span:nth-child(3n-2){color:#c4b5fd}
  .kn span:nth-child(3n-1){color:#7dd3fc}
  .kn span:nth-child(3n){color:#fcd34d}
  .core{
    position:relative;font-size:13.5px;color:var(--ink);background:var(--accent-soft);
    border:1px solid rgba(139,92,246,.22);border-left:3px solid var(--accent);border-radius:0 14px 14px 0;
    padding:15px 17px;margin:0 0 18px;line-height:1.7;
  }
  .core::before{
    content:"核心结论";display:inline-block;font-size:11px;letter-spacing:.12em;color:#c4b5fd;
    font-weight:600;margin-bottom:6px;padding:2px 10px;border:1px solid rgba(139,92,246,.3);border-radius:999px;
  }
  .points{display:flex;flex-direction:column;gap:14px}
  .point{
    --pc:var(--accent);--pc-soft:var(--accent-soft);
    position:relative;display:flex;gap:14px;background:var(--paper-2);border:1px solid var(--line);
    border-left:3px solid var(--pc);border-radius:14px;padding:16px 18px;
    transition:border-color .25s ease,background .25s ease,transform .25s ease,box-shadow .25s ease;
  }
  .point:nth-child(4n+2){--pc:var(--cyan);--pc-soft:var(--cyan-soft)}
  .point:nth-child(4n+3){--pc:var(--gold);--pc-soft:var(--gold-soft)}
  .point:nth-child(4n){--pc:var(--green);--pc-soft:var(--green-soft)}
  .point:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
  .point .dot{
    flex:none;width:26px;height:26px;border-radius:50%;background:var(--pc);color:#fff;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .point .pt{flex:1;min-width:0}
  .pt-tag{display:inline-block;font-size:10.5px;letter-spacing:.14em;font-weight:600;color:var(--pc);margin-bottom:6px;padding:2px 9px;border:1px solid var(--line-2);border-radius:999px}
  .point .pt b{font-size:14.5px;font-weight:700;color:var(--ink);display:block;margin-bottom:7px;line-height:1.5}
  .sent-list{display:flex;flex-direction:column;gap:8px}
  .sent{font-size:13.5px;color:var(--ink-2);line-height:1.7;padding-left:15px;position:relative}
  .sent::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--pc);opacity:.55}
  .sent b{display:inline;font-size:13.5px;color:var(--accent);font-weight:600}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
  .tags i{font-style:normal;font-size:12px;background:var(--green-soft);color:var(--green);padding:5px 12px;border-radius:999px}
  .tags i:nth-child(3n-1){background:var(--cyan-soft);color:var(--cyan)}
  .tags i:nth-child(3n){background:var(--gold-soft);color:var(--gold)}

  body.compact-view .full-only{display:none}
  body:not(.compact-view) .compact-only{display:none}
  body.compact-view section.module{padding:15px 17px;margin-bottom:12px}
  .compact-list{display:flex;flex-direction:column;gap:14px}
  .compact-item{background:transparent;border:0;padding:0}
  .compact-item .ch{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
  .compact-item .ch .n{font-family:"Noto Serif SC",serif;font-weight:700;color:var(--accent);font-size:13px}
  .compact-item .ch b{font-family:"Noto Serif SC",serif;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  .compact-item p{font-size:13px;color:var(--ink-2);line-height:1.6}
  .compact-item .tags{margin-top:8px;padding-top:8px}
  .compact-item .tags i{font-size:12px;padding:4px 10px}

  .summary{background:linear-gradient(135deg,#14111d,#1d1628);border:1px solid var(--line);color:#ece9f3;border-radius:20px;padding:32px 30px;margin-top:30px}
  .summary h3{font-family:"Noto Serif SC",serif;font-size:21px;margin-bottom:20px}
  .summary .lesson{margin-bottom:20px}
  .summary .lesson:last-child{margin-bottom:0}
  .summary .lesson h4{font-size:13.5px;color:var(--accent);margin-bottom:10px;font-weight:600}
  .summary ul{list-style:none;display:grid;gap:10px}
  .summary li{padding-left:22px;position:relative;font-size:13.5px}
  .summary li::before{content:"";position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--green)}
  .back-top{position:fixed;right:26px;bottom:26px;width:44px;height:44px;border-radius:13px;background:var(--accent);color:#14111d;border:0;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:30}
  .back-top.show{opacity:1;pointer-events:auto}
  .back-top:hover{transform:translateY(-3px)}
  footer{position:relative;text-align:center;color:var(--ink-3);font-size:12.5px;padding:30px 0 40px;border-top:1px solid var(--line);margin-top:30px}
  footer .foot-author{position:absolute;right:2px;bottom:14px;font-size:11px;letter-spacing:.08em;color:var(--ink-3);opacity:.7}

  @media (max-width:1023px){
    .custom-scroll-track{display:none;}
    .current-part-hint{display:none;}
    .layout{grid-template-columns:1fr}
    .topbar{display:flex}
    aside.sidebar{
      position:fixed;left:0;top:0;height:100vh;width:296px;z-index:50;
      transform:translateX(-100%);transition:transform .28s ease;
    }
    aside.sidebar.open{transform:translateX(0)}
    .overlay{display:block;position:fixed;inset:0;background:rgba(5,4,10,.6);z-index:45;opacity:0;pointer-events:none;transition:.28s}
    .overlay.show{opacity:1;pointer-events:auto}
    main{padding:0 20px 70px}
  }
  @media (max-width:600px){
    body{font-size:13.5px;line-height:1.7}
    section.module{padding:18px 16px}
    body.compact-view section.module{padding:13px 15px;margin-bottom:11px}
    .module-head{gap:12px;padding-bottom:13px;margin-bottom:16px}
    .num{width:34px;height:34px;font-size:14px;border-radius:10px}
    .point{gap:10px;padding:13px 14px;border-radius:12px}
    .point .dot{width:22px;height:22px;font-size:11.5px}
    .pt-tag{font-size:10px;padding:1px 8px;margin-bottom:5px}
    .point .pt b{font-size:14px;margin-bottom:6px}
    .sent{font-size:13.5px;line-height:1.7}
    .core{font-size:13.5px;padding:13px 15px}
    .compact-item .ch b{font-size:13.5px}
    .compact-item p{font-size:12.5px}
    .hero{padding:26px 0 20px}
    .hero .stats{gap:18px}
    .summary{padding:22px 18px}
    .topbar .tt{font-size:14px}
    .m-switch button{padding:6px 10px;font-size:12px}
    .locked-block{padding:28px 18px;border-radius:20px}
  }
  @media (max-width:380px){
    .point{flex-direction:column;gap:8px}
    .point .dot{margin-top:0}
    .hero .stats{gap:14px}
    .hero .stats div{flex:1 1 40%}
    .module-head{gap:10px}
  }
</style>
</head>
<body class="compact-view">
<div class="top-progress-wrap">
  <div class="top-progress-bar"></div>
</div>
<div class="current-part-hint" id="currentPartHint"></div>
<div class="custom-scroll-track">
  <div class="custom-scroll-thumb"></div>
</div>

<div class="topbar">
  <button class="burger" id="burger" aria-label="目录">☰</button>
  <div class="tt">草台班子<small> · 艺术 IP</small></div>
  <div class="m-switch">
    <button data-view="full">完整版</button>
    <button data-view="compact" class="active">精简版</button>
  </div>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar">

const toc = document.getElementById("toc");
const content = document.getElementById("content");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function splitSentences(html){
  const parts = (html.match(/[^。！？；]+[。！？；]?/g)||[]).map(s=>s.trim()).filter(Boolean);
  return parts.length ? parts : [html];
}
function render(){
  let tocHtml = "", mainHtml = "", idx = 0;
  courses.forEach((c,ci)=>{
    tocHtml += `<div class="toc-group">
      <div class="toc-title"><span class="toc-badge">${c.badge}</span><span class="toc-cname">${c.title}</span>${c.promo?`<span class="toc-promo">${c.promo}</span>`:""}</div>
      <div class="toc-list">`;
    mainHtml += `<div class="course ${ci%2===1?'alt':''}" id="${c.id}" data-badge="${c.badge}">`;
    mainHtml += `<div class="course-head"><div class="badge">${c.badge}</div><h3>${c.title}</h3>${c.promo?`<span class="head-promo">${c.promo}</span>`:""}<p>${c.desc}</p></div>`;
    c.modules.forEach((m,mi)=>{
      idx++;
      tocHtml += `<a href="#${m.id}" data-id="${m.id}"><span class="no">${ci+1}.${mi+1}</span>${m.title}</a>`;
      mainHtml += `
      <section class="module" id="${m.id}" data-search="${esc((m.title+m.kn.join(" ")+m.points.map(p=>p.t+p.d).join(" ")+m.tags.join(" ")+m.core).toLowerCase())}">
        <div class="module-head">
          <div class="num">${ci+1}.${mi+1}</div>
          <div class="tt">
            <h4>${m.title}</h4>
            <div class="kn">${m.kn.map(k=>`<span>${k}</span>`).join("")}</div>
          </div>
        </div>
        <div class="core full-only">${m.core}</div>
        <div class="points full-only">
          ${m.points.map((p,pi)=>`
            <div class="point">
              <div class="dot">${pi+1}</div>
              <div class="pt">
                <span class="pt-tag">要点 ${String(pi+1).padStart(2,"0")}</span>
                <b>${p.t}</b>
                <div class="sent-list">${splitSentences(p.d).map(s=>`<div class="sent">${s}</div>`).join("")}</div>
              </div>
            </div>`).join("")}
        </div>
        <div class="tags full-only">${m.tags.map(t=>`<i>${t}</i>`).join("")}</div>
        <div class="compact-only compact-item">
          <div class="ch"><span class="n">${ci+1}.${mi+1}</span><b>${m.title}</b></div>

          <div class="tags">${m.tags.map(t=>`<i>${t}</i>`).join("")}</div>
        </div>
      </section>`;
    });
    tocHtml += `</div></div>`;
    mainHtml += `</div>`;
  });
  tocHtml += `<div class="toc-group toc-locked-group">
    <div class="toc-title"><span class="toc-badge toc-badge-locked">未解锁</span><span class="toc-cname">后续课程</span></div>
    <div class="toc-list">
      ${lockedModules.map((t,i)=>`<a class="locked" data-locked="${i+1}" href="javascript:;" title="暂无权限查看"><span class="lock-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2.5" /><path d="M8 10V7.5a4 4 0 0 1 8 0V10" /><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none" /></svg></span><span class="lk-text">${t}</span><span class="lock-tag">无权限</span></a>`).join("")}

    <div class="lesson"><h4>${s.title}</h4><ul>${s.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>

function switchView(v){
  document.body.classList.toggle("compact-view", v==="compact");
  document.querySelectorAll("[data-view]").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.view===v);
  });
}
document.querySelectorAll("[data-view]").forEach(btn=>{
  btn.addEventListener("click", ()=>switchView(btn.dataset.view));
});

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
document.getElementById("burger").onclick = ()=>{sidebar.classList.add("open");overlay.classList.add("show")};
overlay.onclick = ()=>{sidebar.classList.remove("open");overlay.classList.remove("show")};
toc.addEventListener("click", e=>{
  const a = e.target.closest("a");
  if(!a) return;
  e.preventDefault();
  if(a.classList.contains("locked")){ denyAccess(a); return; }
  const target = document.getElementById(a.dataset.id);
  switchView("full");
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
  if(target){ setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"start"}), 80); }
});
function denyAccess(a){
  a.classList.remove("denied"); void a.offsetWidth; a.classList.add("denied");
  const tip = a.querySelector(".lock-tag");
  if(tip){ tip.classList.add("flash"); setTimeout(()=>tip.classList.remove("flash"), 1200); }
  setTimeout(()=>a.classList.remove("denied"), 480);
}

const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  searchClear.style.display = q ? "block" : "none";
  document.querySelectorAll("section.module").forEach(sec=>{
    const hit = !q || sec.dataset.search.includes(q);
    sec.style.display = hit ? "" : "none";
    if(hit){ sec.classList.remove("fade-up"); void sec.offsetWidth; sec.classList.add("fade-up"); }
  });
  document.querySelectorAll(".toc-group").forEach(g=>{
    if(g.classList.contains("toc-locked-group")){ g.style.display = ""; return; }
    let visible = 0;
    g.querySelectorAll("a").forEach(a=>{
      const sec = document.getElementById(a.dataset.id);
      const show = sec && sec.style.display !== "none";
      a.style.display = show ? "" : "none";
      if(show) visible++;
    });
    g.style.display = visible ? "" : "none";
  });
  document.querySelectorAll(".course").forEach(c=>{
    const any = [...c.querySelectorAll("section.module")].some(s=>s.style.display!=="none");
    c.style.display = any ? "" : "none";
  });
}
searchInput.addEventListener("input", applyFilter);
searchClear.onclick = ()=>{searchInput.value="";applyFilter();searchInput.focus()};

const spyLinks = ()=>[...toc.querySelectorAll("a")];
const obs = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      spyLinks().forEach(a=>a.classList.toggle("active", a.dataset.id===en.target.id));
    }
  });
},{rootMargin:"-20% 0px -70% 0px"});
function bindSpy(){document.querySelectorAll("section.module").forEach(s=>obs.observe(s))}

const revealObs = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){ en.target.classList.add("in"); revealObs.unobserve(en.target); }
  });
},{rootMargin:"0px 0px -6% 0px",threshold:.06});
function bindReveal(){
  document.querySelectorAll("section.module").forEach(s=>{ s.classList.add("reveal"); revealObs.observe(s); });
}

const topProgressWrap = document.querySelector('.top-progress-wrap');
const topProgressBar = document.querySelector('.top-progress-bar');
const thumb = document.querySelector('.custom-scroll-thumb');
const trackEl = document.querySelector('.custom-scroll-track');
const currentPartHint = document.getElementById("currentPartHint");

let hideTimer = null;
let isDragging = false;

function updateScrollUI(){
  const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
  const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
  const percent = scrollHeight <= 0 ? 0 : scrollTop / scrollHeight;

  topProgressBar.style.width = `${percent*100}%`;
  const trackH = trackEl.clientHeight;
  const thumbH = thumb.clientHeight;
  const maxTop = trackH - thumbH;
  thumb.style.top = (percent * maxTop) + "px";

  let showBadge = "";
  document.querySelectorAll(".course").forEach(course=>{
    const rect = course.getBoundingClientRect();
    if(rect.top <= 200 && rect.bottom >= 200){
      showBadge = course.dataset.badge;
    }
  });
  if(showBadge){
    currentPartHint.innerText = showBadge;
    currentPartHint.classList.add("show");
  }else{
    currentPartHint.classList.remove("show");
  }
}

  topProgressWrap.classList.add('show');
  thumb.classList.add('show');
  clearTimeout(hideTimer);
  if (!isDragging) {
    hideTimer
